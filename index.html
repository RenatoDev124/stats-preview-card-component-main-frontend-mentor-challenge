<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Stats preview card component</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main>
        <article class="card">
            <header class="card__header">
                <div class="card__banner"></div>
            </header>
            <section class="card__body">
                <div class="container content">
                    <h2 class="card__title">Get <span class="mark--text">insights</span>
                        that help your business
                        grow.</h2>
                    <p class="card__text">Discover the benefits of data analytics and make better decisions
                        regarding revenue, customer
                        experience, and overall efficiency.</p>
                </div>
            </section>
            <footer class="card__footer">
                <div class="card__stats container">
                    <div>
                        <h3 class="card__number">10k+</h3>
                        <p class="card__text text--uppercase">companies</p>
                    </div>
                    <div>
                        <h3 class="card__number">314</h3>
                        <p class="card__text text--uppercase">templates</p>
                    </div>
                    <div>
                        <h3 class="card__number">12m+</h3>
                        <p class="card__text text--uppercase">queries</p>
                    </div>
                </div>
            </footer>

        </article>
    </main>

    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
        Coded by <a href="#">Renato</a>.
    </footer>
</body>

</html>
